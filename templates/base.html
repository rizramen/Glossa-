<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Glossa{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="site-nav">
    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/dictionary/">Dictionaries</a>
        <a href="/quiz/">Quiz</a>
        <a href="/friends/">Friends</a>
        {% if user.is_authenticated %}
        <span class="nav-account-start nav-greeting">Hello, <strong>{{ user.username }}</strong>!</span>

        <form action="{% url 'logout' %}" method="post" class="inline-form">
            {% csrf_token %}
            <button type="submit" class="button-link button-link-danger">
                Logout
            </button>
        </form>
        {% else %}
        <a class="nav-account-start" href="{% url 'login' %}">Login</a>
        {% endif %}
    </div>
</nav>

<main class="page-shell">
{% block page_content %}{% endblock %}
</main>

</body>
</html>
