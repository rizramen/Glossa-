services:
  - type: web
    name: glossa
    runtime: python
    buildCommand: ./build.sh
    startCommand: gunicorn Glossa.wsgi:application
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: glossa-db
          property: connectionString

databases:
  - name: glossa-db
    plan: free
