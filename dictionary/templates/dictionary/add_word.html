{% extends "base.html" %}
{% block title %}Add Word | Glossa{% endblock %}

{% block page_content %}
<section class="form-card">
    <h1>Add New Word</h1>
    <p class="section-intro">Save a term and its meaning to {{ dictionary.name }}. This dictionary uses {{ dictionary.get_language_display }}.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button-primary">Save</button>
    </form>
</section>
{% endblock %}
