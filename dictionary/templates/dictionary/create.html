{% extends "base.html" %}
{% block title %}Create Dictionary | Glossa{% endblock %}

{% block page_content %}
<section class="form-card">
  <h1>Create Dictionary</h1>
  <p class="section-intro">Start a new vocabulary collection and choose the single language it will use.</p>
  <form method="post" class="stack-form">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="button-primary">Create</button>
  </form>
</section>
{% endblock %}
