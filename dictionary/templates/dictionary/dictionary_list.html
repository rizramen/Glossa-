{% extends "base.html" %}

{% block page_content %}
<h1>Dictionary list</h1>

<ul>
    {% for dictionary in object_list %}
        <li>
    <a href="{% url 'dictionary:detail' dictionary.id %}">{{ dictionary.name }}</a>
        </li>
    {% empty %}
        <li>No dictionaries yet.</li>
    {% endfor %}
</ul>

{% endblock %}
