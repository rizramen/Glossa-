{% extends "base.html" %}
{% block title %}Login | Glossa{% endblock %}

{% block page_content %}
<section class="form-card">
    <h1>Login</h1>
    <p class="section-intro">Access your personal dictionaries and study workspace.</p>
    <form method="post" class="stack-form">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button-primary">Login</button>
    </form>
    <p class="spaced-text">No account yet? <a href="{% url 'register' %}">Register here</a></p>
</section>
{% endblock %}
